name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # The Rust binary is tiny and the webview comes from the OS, so artifacts are
  # single-digit megabytes. Linux is not built: WebKitGTK cannot report the side
  # mouse buttons, so a Linux build could not do this app's core job.
  # ---------------------------------------------------------------------------
  tauri:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal binary covers Intel and Apple Silicon in a single
          # download, which a Rust binary can comfortably afford.
          - name: macOS (universal)
            os: macos-15
            targets: universal-apple-darwin
            script: build:mac
            artifact: dist/*.zip
          - name: Windows (x64)
            os: windows-latest
            targets: x86_64-pc-windows-msvc
            script: build:win
            artifact: dist/*.exe
          # arm64 Windows is cross-compiled from the x64 runner; Rust supports
          # the target even though the runner cannot execute the result.
          - name: Windows (arm64)
            os: windows-latest
            targets: aarch64-pc-windows-msvc
            script: build:win-arm64
            artifact: dist/*.exe

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # universal-apple-darwin is a lipo of the two Darwin triples, so both
          # must be installed rather than the pseudo-target itself.
          targets: ${{ matrix.targets == 'universal-apple-darwin' && 'x86_64-apple-darwin,aarch64-apple-darwin' || matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.targets }}

      - run: npm ci

      # Pure Node, no webview needed, so it runs on every platform.
      - run: npm test

      - run: npm run ${{ matrix.script }}

      # archive: false uploads the file as-is. Without it GitHub wraps every
      # artifact in a second zip, so macOS users download a zip containing a
      # zip — which Archive Utility rejects as "an unsupported format".
      # Each job here produces exactly one file, which is what this requires.
      # The artifact is named after the file, so `name` is ignored.
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          archive: false
          path: ${{ matrix.artifact }}

  release:
    needs: [tauri]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
