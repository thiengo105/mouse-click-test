name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One macOS runner emits both Intel and Apple Silicon DMGs: Electron
          # binaries are downloaded prebuilt, so no cross-compiler is involved.
          - name: macOS (x64 + arm64)
            os: macos-14
            script: dist:mac
          - name: Windows (x64 + arm64)
            os: windows-latest
            script: dist:win
          - name: Linux (AppImage x64)
            os: ubuntu-22.04
            script: dist:linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build portable artifacts
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Developer ID certificate in CI, so skip signing entirely.
          # Remove this and add CSC_LINK / CSC_KEY_PASSWORD to sign + notarize.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-portable
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.AppImage

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
