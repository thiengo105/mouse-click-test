# Electron now covers Linux only. macOS and Windows ship the Tauri shell in
# src-tauri, which is ~40x smaller. Linux stays on Electron because WebKitGTK
# never maps the side mouse buttons: WebEventFactory.cpp translates GDK buttons
# 1/2/3 and nothing else, so back/forward would be undetectable there.
appId: dev.doltech.mouseclicktest
productName: Mouse Click Test
copyright: Copyright © 2026 Thien Ngo

directories:
  output: dist
  buildResources: build

files:
  - src/main/**/*
  - src/renderer/**/*
  - package.json

linux:
  category: Utility
  synopsis: Mouse button and scroll wheel diagnostic tool
  icon: build/appicon.png
  # AppImage is already a portable single file; no install step exists.
  target:
    - target: AppImage
      arch: [x64]

appImage:
  artifactName: MouseClickTest-${version}-linux-${arch}.${ext}
